name: Frontend CI/CD

on:
  push:
    branches:
      - front-end

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd front
          npm install

      - name: Build project
        run: |
          cd front
          npm run build

      - name: Copy dist folder to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "front/dist/*"
          target: "/var/www/rentapp"
          strip_components: 1
